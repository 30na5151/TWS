<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TWS — Think. Write. Stop.</title><style>
:root{--bg:#050505;--card:#151515;--text:#fff;--muted:#aaa;--line:#333;--accent:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif}.app{max-width:620px;margin:auto;padding:22px 16px 50px}.logo{text-align:center;font-size:46px;font-weight:900;letter-spacing:.12em}.tag{text-align:center;font-weight:800;margin-bottom:25px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}.btn{width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:800;font-size:16px;margin:6px 0}.primary{background:#fff;color:#000}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.active{outline:3px solid #fff}.top{display:flex;justify-content:space-between;align-items:center}.letter{font-size:55px;font-weight:900}.timer{font-size:22px;font-weight:800}label{display:block;font-weight:700;margin:11px 0 5px}input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:16px}.row{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:7px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.small{font-size:13px;color:var(--muted)}.pts{font-weight:900}.good{font-weight:900}.bad{text-decoration:line-through;color:#aaa}.pill{display:inline-block;border:1px solid var(--line);padding:6px 9px;border-radius:999px;margin:3px}.hidden{display:none}h2{margin:5px 0 10px}.score{font-size:34px;font-weight:900;text-align:center}.note{font-size:13px;color:var(--muted);line-height:1.4}
</style></head><body><div class="app" id="app"></div><script>
const DATA={nl:{name:'🇳🇱 Nederlands',letters:'ABCDEFGHIKLMNOPRSTUVWZ'.split(''),cats:['Naam','Achternaam','Land','Stad','Dier','Eten','Fruit','Kleur','Beroep','Voorwerp'],words:{Naam:{A:'Anna',B:'Bram',D:'Daan',E:'Eva',F:'Finn',G:'Gijs',H:'Hugo',I:'Iris',J:'Jan',K:'Kim',L:'Lisa',M:'Milan',N:'Noah',O:'Omar',P:'Piet',R:'Ruben',S:'Sanne',T:'Tom',V:'Vera',W:'Wout',Z:'Zoë'},Achternaam:{B:'Bakker',D:'De Jong',J:'Jansen',K:'Kok',M:'Mulder',S:'Smit',V:'Visser'},Land:{A:'Albanië',B:'België',D:'Denemarken',E:'Egypte',F:'Frankrijk',G:'Griekenland',I:'India',J:'Japan',K:'Kenia',L:'Libanon',M:'Mexico',N:'Nederland',O:'Oman',P:'Portugal',R:'Roemenië',S:'Spanje',T:'Turkije',V:'Vietnam',Z:'Zwitserland'},Stad:{A:'Amsterdam',B:'Breda',D:'Delft',E:'Eindhoven',G:'Groningen',H:'Haarlem',L:'Leiden',M:'Maastricht',N:'Nijmegen',R:'Rotterdam',T:'Tilburg',U:'Utrecht',V:'Venlo',Z:'Zwolle'},Dier:{A:'Aap',B:'Beer',D:'Dolfijn',E:'Ezel',G:'Geit',H:'Hond',K:'Kat',L:'Leeuw',M:'Muis',O:'Olifant',P:'Paard',S:'Slang',T:'Tijger',V:'Vos',Z:'Zebra'},Eten:{A:'Aardappelen',B:'Bami',F:'Friet',H:'Hutspot',K:'Kaas',L:'Lasagne',P:'Pizza',R:'Rijst',S:'Soep',T:'Tosti'},Fruit:{A:'Appel',B:'Banaan',D:'Druif',F:'Framboos',K:'Kiwi',M:'Mango',P:'Peer'},Kleur:{B:'Blauw',G:'Geel',R:'Rood',W:'Wit',Z:'Zwart'},Beroep:{A:'Arts',B:'Bakker',D:'Dokter',K:'Kok',L:'Leraar',P:'Piloot',S:'Schilder',T:'Timmerman'},Voorwerp:{B:'Boek',F:'Fles',K:'Kast',L:'Lamp',P:'Pen',S:'Stoel',T:'Tafel',V:'Vork'}}},en:{name:'🇬🇧 English',letters:'ABCDEFGHJKLMNPRSTUVWY'.split(''),cats:['Name','Surname','Country','City','Animal','Food','Fruit','Color','Profession','Object'],words:{}}};
let st={lang:'nl',rounds:5,timer:120,diff:'medium',round:1,used:[],score:0,botScore:0,letter:null,tick:null,left:0,extras:[]};const app=document.getElementById('app');
function btn(t,fn,c=''){return `<button class="btn ${c}" onclick="${fn}">${t}</button>`}function home(){clearInterval(st.tick);app.innerHTML=`<div class="logo">TWS</div><div class="tag">THINK. WRITE. STOP.</div>${btn('🤖 SOLO vs TWS BOT','setup()','primary')}${btn(DATA[st.lang].name,'langs()')}${btn('⚙️ SETTINGS','alert(\'Themes, sound, music & vibration komen in de volgende build.\')')}<div class="card note">Testbuild 1.1 • Bot en speler krijgen altijd dezelfde letter • letters herhalen niet binnen één game • Nederlandse validatie is strenger.</div>`}
function langs(){app.innerHTML=`<h2>Language</h2>${btn('🇳🇱 Nederlands',"st.lang='nl';home()",'primary')}${btn('🇬🇧 English',"st.lang='en';home()")}${btn('← Terug','home()')}`}
function setup(){app.innerHTML=`<h2>Solo vs Bot 🤖</h2><div class="card"><b>Timer</b><div class="grid3">${btn('1 min',"pickTimer(60,this)")}${btn('2 min',"pickTimer(120,this)",'active')}${btn('3 min',"pickTimer(180,this)")}</div>${btn('Geen timer',"pickTimer(0,this)")}</div><div class="card"><b>Rondes</b><div class="grid3">${btn('5',"pickRounds(5,this)",'active')}${btn('10',"pickRounds(10,this)")}${btn('15',"pickRounds(15,this)")}</div></div><div class="card"><b>Bot</b><div class="grid3">${btn('Easy',"pickDiff('easy',this)")}${btn('Medium',"pickDiff('medium',this)",'active')}${btn('Hard',"pickDiff('hard',this)")}</div></div><div class="card"><b>+ Extra categorie</b><input id="extra" placeholder="Bijv. Sport"><button class="btn" onclick="addExtra()">+ Toevoegen</button><div id="elist" class="small">${st.extras.join(' • ')}</div></div>${btn('START GAME','newGame()','primary')}${btn('← Terug','home()')}`}
function pickTimer(v,e){st.timer=v;sel(e)}function pickRounds(v,e){st.rounds=v;sel(e)}function pickDiff(v,e){st.diff=v;sel(e)}function sel(e){[...e.parentElement.children].forEach(x=>x.classList?.remove('active'));e.classList.add('active')}function addExtra(){let v=document.getElementById('extra').value.trim();if(v&&!st.extras.includes(v))st.extras.push(v);document.getElementById('elist').textContent=st.extras.join(' • ')}
function newGame(){st.round=1;st.used=[];st.score=0;st.botScore=0;nextRound()}
function nextLetter(){let pool=DATA[st.lang].letters.filter(x=>!st.used.includes(x));if(!pool.length)return null;let l=pool[Math.floor(Math.random()*pool.length)];st.used.push(l);return l}
function nextRound(){clearInterval(st.tick);st.letter=nextLetter();if(!st.letter)return final();st.left=st.timer;let cats=[...DATA[st.lang].cats,...st.extras];app.innerHTML=`<div class="top"><div><b>Ronde ${st.round}/${st.rounds}</b><div class="small">Gebruikte letters: ${st.used.join(', ')}</div></div><div style="text-align:center"><div class="letter">${st.letter}</div><div class="small">JIJ + BOT</div><div id="clock" class="timer">${time(st.left)}</div></div></div><div class="card">${cats.map((c,i)=>`<label>${c}</label><input id="a${i}" data-cat="${c}" autocomplete="off" placeholder="${st.letter}…">`).join('')}</div>${btn('STOP!','review()','primary')}`;if(st.timer===0)document.getElementById('clock').textContent='∞';else st.tick=setInterval(()=>{st.left--;let c=document.getElementById('clock');if(c)c.textContent=time(st.left);if(st.left<=0)review()},1000)}
function normalize(x){return x.trim().toLocaleLowerCase(st.lang==='nl'?'nl-NL':'en-US')}
function known(cat,ans){if(st.extras.includes(cat))return ans.trim().toUpperCase().startsWith(st.letter);let bank=DATA[st.lang].words[cat]||{};let target=bank[st.letter];if(!target)return false;return normalize(ans)===normalize(target)}
function botAnswer(cat){let bank=DATA[st.lang].words[cat]||{},ans=bank[st.letter]||'';let chance=st.diff==='easy'?.45:st.diff==='hard'?.9:.7;return Math.random()<chance?ans:''}
function review(){clearInterval(st.tick);let cats=[...DATA[st.lang].cats,...st.extras];let rows=[];let rp=0,bp=0;cats.forEach((cat,i)=>{let mine=(document.getElementById('a'+i)?.value||'').trim(),bot=botAnswer(cat);let mv=known(cat,mine),bv=!!bot;let same=mv&&bv&&normalize(mine)===normalize(bot);let mp=mv?(same?5:10):0,botp=bv?(same?5:10):0;rp+=mp;bp+=botp;rows.push({cat,mine,bot,mv,bv,mp,botp})});st.score+=rp;st.botScore+=bp;app.innerHTML=`<h2>Answer Check — letter ${st.letter}</h2><div class="small">Dezelfde letter voor jou en de Bot. Controleer eerst de antwoorden, daarna pas de score.</div><div class="card"><div class="row"><b>Categorie</b><b>Jij</b><b>Bot 🤖</b></div>${rows.map(x=>`<div class="row"><div><b>${x.cat}</b></div><div class="${x.mv?'good':'bad'}">${x.mine||'—'}<div class="pts">${x.mp} pt</div></div><div class="${x.bv?'good':'bad'}">${x.bot||'—'}<div class="pts">${x.botp} pt</div></div></div>`).join('')}</div><div class="score">${st.score} — ${st.botScore}</div><div class="note">⚠️ Deze testbuild gebruikt voorlopig een beperkte Nederlandse woordenlijst. Een onbekend maar correct Nederlands antwoord kan daarom nog als fout worden gezien. Dat gaan we uitbreiden.</div>${btn(st.round>=st.rounds?'EINDRESULTAAT':'VOLGENDE RONDE',st.round>=st.rounds?'final()':'advance()','primary')}`}
function advance(){st.round++;nextRound()}function final(){clearInterval(st.tick);let msg=st.score===st.botScore?'GELIJKSPEL':st.score>st.botScore?'JIJ WINT 🏆':'BOT WINT 🤖';app.innerHTML=`<div class="logo">TWS</div><div class="score">${msg}</div><div class="score">${st.score} — ${st.botScore}</div><div class="card"><b>Letters gebruikt:</b><br>${st.used.map(x=>`<span class="pill">${x}</span>`).join('')}</div>${btn('OPNIEUW SPELEN','setup()','primary')}${btn('HOOFDMENU','home()')}`}
function time(n){if(st.timer===0)return'∞';return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}home();
</script></body></html>
