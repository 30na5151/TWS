<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Think. Write. Stop. — TWS Word Game</title><meta name="description" content="Think. Write. Stop. is a fast multilingual categories word game for solo and multiplayer play."><meta name="application-name" content="Think. Write. Stop."><meta property="og:title" content="Think. Write. Stop. — TWS Word Game"><meta property="og:description" content="Think fast, write your answers, and stop the round. A multilingual categories word game."><style>
:root{--bg:#050505;--card:#151515;--card2:#202020;--text:#fff;--muted:#aaa;--line:#353535;--accent:#fff;--accentText:#000}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif}.app{max-width:650px;margin:auto;padding:24px 16px 70px;min-height:100vh}.logo{text-align:center;font-size:48px;font-weight:950;letter-spacing:.14em}.tag{text-align:center;font-weight:900;margin:4px 0 25px}.sub{color:var(--muted);font-size:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}.btn{width:100%;padding:15px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:850;font-size:16px;margin:5px 0}.primary{background:var(--accent);color:var(--accentText)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{outline:none;-webkit-tap-highlight-color:transparent}.choice:focus,.choice:focus-visible{outline:none}.choice.active{border:3px solid var(--accent);background:var(--card2);padding:13px 10px}.choice:not(.active){border:1px solid var(--line);background:var(--card)}h2{margin:4px 0 10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.letter{font-size:64px;font-weight:950;text-align:center}.clock{font-size:22px;font-weight:900;text-align:center}.input{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:16px}.cat{display:block;margin:10px 0}.cat span{font-weight:750;font-size:14px}.pill{display:inline-block;padding:6px 9px;border:1px solid var(--line);border-radius:999px;margin:3px;font-size:13px}.review{display:grid;grid-template-columns:1fr 1.15fr 1.15fr;gap:7px;align-items:start;border-bottom:1px solid var(--line);padding:11px 0;font-size:13px}.review b{font-size:14px}.ans{word-break:break-word}.pts{font-weight:900}.reviewBtns{display:flex;gap:4px;margin-top:5px}.mini{border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);padding:5px 7px;font-weight:800}.mini.on{background:var(--accent);color:var(--accentText)}.score{font-size:42px;font-weight:950;text-align:center}.switch{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}select{width:100%;padding:12px;border-radius:11px;background:var(--card);color:var(--text);border:1px solid var(--line)}body.white{--bg:#f5f5f5;--card:#fff;--card2:#eee;--text:#111;--muted:#666;--line:#ccc;--accent:#111;--accentText:#fff}body.blue{--bg:#071525;--card:#102943;--card2:#173a5e;--line:#315879;--accent:#dcecff;--accentText:#071525}body.green{--bg:#07170d;--card:#102a18;--card2:#183b23;--line:#315d3d;--accent:#e2ffe8;--accentText:#07170d}body.pink{--bg:#200812;--card:#371020;--card2:#50182f;--line:#75334e;--accent:#ffe2ed;--accentText:#200812}body.purple{--bg:#130922;--card:#24123b;--card2:#351b55;--line:#56347c;--accent:#eee1ff;--accentText:#130922}.rtl{direction:rtl}.notice{padding:10px;border-radius:12px;background:var(--card2);font-size:13px;color:var(--muted)}
</style></head><body><main class="app" id="app"></main><script>
const LANGS={nl:{flag:'🇳🇱',name:'Nederlands',dir:'ltr',cats:['Naam','Achternaam','Land','Stad','Dier','Eten','Fruit','Kleur','Beroep','Voorwerp'],letters:'ABCDEFGHJKLMNPRSTUVWZ'},en:{flag:'🇬🇧',name:'English',dir:'ltr',cats:['Name','Surname','Country','City','Animal','Food','Fruit','Color','Profession','Object'],letters:'ABCDEFGHJKLMNPRSTUVWZ'},fa:{flag:'🇮🇷',name:'فارسی',dir:'rtl',cats:['اسم','فامیل','کشور','شهر','حیوان','غذا','میوه','رنگ','شغل','اشیا'],letters:'ابتپتجچحخدذرزسشصطعغفقکگلمنوهی'},de:{flag:'🇩🇪',name:'Deutsch',dir:'ltr',cats:['Vorname','Nachname','Land','Stadt','Tier','Essen','Obst','Farbe','Beruf','Gegenstand'],letters:'ABCDEFGHJKLMNPRSTUWZ'},ru:{flag:'🇷🇺',name:'Русский',dir:'ltr',cats:['Имя','Фамилия','Страна','Город','Животное','Еда','Фрукт','Цвет','Профессия','Предмет'],letters:'АБВГДЕЖЗИКЛМНОПРСТУФХЧШЭЮЯ'},ar:{flag:'🇸🇦',name:'العربية',dir:'rtl',cats:['الاسم','اسم العائلة','دولة','مدينة','حيوان','طعام','فاكهة','لون','مهنة','شيء'],letters:'ابتثجحخدذرزسشصضطظعغفقكلمنهوي'},zh:{flag:'🇨🇳',name:'中文',dir:'ltr',cats:['名字','姓氏','国家','城市','动物','食物','水果','颜色','职业','物品'],letters:'天地人山水火木金大小中'},tr:{flag:'🇹🇷',name:'Türkçe',dir:'ltr',cats:['İsim','Soyisim','Ülke','Şehir','Hayvan','Yemek','Meyve','Renk','Meslek','Nesne'],letters:'ABÇDEFGHİKLMNOPRSTUY'},hi:{flag:'🇮🇳',name:'हिन्दी',dir:'ltr',cats:['नाम','उपनाम','देश','शहर','जानवर','खाना','फल','रंग','पेशा','वस्तु'],letters:'अआइईउएकगचजतदनपबमरसलह'}};
const DB={nl:{A:{Naam:['Adam','Anna'],Land:['Albanië','Argentinië'],Stad:['Amsterdam','Arnhem'],Dier:['Aap','Adelaar'],Eten:['Aardappel'],Fruit:['Aardbei','Abrikoos'],Kleur:['Antraciet'],Beroep:['Arts','Architect'],Voorwerp:['Afstandsbediening']},B:{Naam:['Bas','Bram'],Achternaam:['Bakker'],Land:['België','Brazilië'],Stad:['Breda'],Dier:['Beer','Bever'],Eten:['Bami','Brood'],Fruit:['Banaan','Braam'],Kleur:['Blauw','Bruin'],Beroep:['Bakker','Boer'],Voorwerp:['Boek','Beker']},G:{Naam:['Gijs'],Land:['Griekenland'],Stad:['Groningen','Gouda'],Dier:['Giraffe','Gans'],Eten:['Gehakt'],Fruit:['Granaatappel'],Kleur:['Geel','Groen'],Beroep:['Gids'],Voorwerp:['Gordijn']},S:{Naam:['Sina','Sam'],Achternaam:['Smit','Smeets'],Land:['Spanje','Suriname'],Stad:['Sneek'],Dier:['Slang','Schaap'],Eten:['Soep','Sushi'],Fruit:['Sinaasappel'],Kleur:['Sepia'],Beroep:['Schilder','Slager'],Voorwerp:['Sleutel','Stoel']},U:{Naam:['Usman'],Stad:['Utrecht'],Dier:['Uil'],Eten:['Ui'],Beroep:['Uitgever'],Voorwerp:['USB-stick']},Z:{Naam:['Zoë','Zaid'],Achternaam:['Zwart'],Land:['Zambia','Zimbabwe'],Stad:['Zwolle','Zutphen'],Dier:['Zebra','Zwaan'],Eten:['Zuurkool'],Fruit:['Zwarte bes'],Kleur:['Zwart'],Beroep:['Zanger'],Voorwerp:['Zak','Zeep']}}};
let st=JSON.parse(localStorage.getItem('tws-settings')||'null')||{lang:'nl',theme:'dark',sound:true,music:false,vibration:true};let game=null;const app=document.getElementById('app');
function save(){localStorage.setItem('tws-settings',JSON.stringify(st))}function apply(){document.body.className=st.theme+(LANGS[st.lang].dir==='rtl'?' rtl':'');document.documentElement.lang=st.lang;document.documentElement.dir=LANGS[st.lang].dir}function btn(t,id,c=''){return `<button class="btn ${c}" id="${id}">${t}</button>`}function q(id){return document.getElementById(id)}function buzz(){if(st.vibration&&navigator.vibrate)navigator.vibrate(30)}function beep(){if(!st.sound)return;try{let a=new (AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);g.gain.value=.04;o.start();o.stop(a.currentTime+.08)}catch(e){}}function home(){apply();app.innerHTML=`<div class="logo">TWS</div><div class="tag">THINK. WRITE. STOP.</div><div class="sub" style="text-align:center;margin:-16px 0 22px">Think. Write. Stop. — TWS Word Game</div>${btn('🤖 SOLO vs TWS BOT','solo','primary')}${btn('👥 MULTIPLAYER','multi')}${btn(`${LANGS[st.lang].flag} ${LANGS[st.lang].name}`,'language')}${btn('⚙️ SETTINGS','settings')}<div class="notice">Multiplayer rooms worden de volgende grote stap. Deze build is voor Solo, talen, instellingen en het nieuwe Answer Check-systeem.</div>`;q('solo').onclick=setup;q('language').onclick=languages;q('settings').onclick=settings;q('multi').onclick=()=>alert('Online multiplayer komt in de volgende fase: 2–6 spelers, roomcode, host, gedeelde letter en stemmen op betwiste antwoorden.')}
function languages(){app.innerHTML=`<h2>🌐 Language</h2><div class="grid">${Object.entries(LANGS).map(([k,l])=>btn(`${l.flag} ${l.name}`,'l_'+k,k===st.lang?'choice active':'choice')).join('')}</div>${btn('← Back','back')}`;Object.keys(LANGS).forEach(k=>q('l_'+k).onclick=()=>{st.lang=k;save();apply();languages()});q('back').onclick=home}
function settings(){app.innerHTML=`<h2>⚙️ Settings</h2><div class="card"><b>Theme</b><div class="grid3" style="margin-top:8px">${['dark','white','blue','green','pink','purple'].map(x=>btn(x[0].toUpperCase()+x.slice(1),'th_'+x,st.theme===x?'choice active':'choice')).join('')}</div></div><div class="card"><div class="switch"><b>Sound</b><input id="sound" type="checkbox" ${st.sound?'checked':''}></div><div class="switch"><b>Music</b><input id="music" type="checkbox" ${st.music?'checked':''}></div><div class="switch"><b>Vibration</b><input id="vib" type="checkbox" ${st.vibration?'checked':''}></div></div>${btn('← Back','back')}`;['dark','white','blue','green','pink','purple'].forEach(x=>q('th_'+x).onclick=()=>{st.theme=x;save();apply();settings()});q('sound').onchange=e=>{st.sound=e.target.checked;save();beep()};q('music').onchange=e=>{st.music=e.target.checked;save()};q('vib').onchange=e=>{st.vibration=e.target.checked;save();buzz()};q('back').onclick=home}
function setup(){game={difficulty:'medium',time:120,rounds:5,round:1,score:0,botScore:0,used:[],extra:[],tick:null};app.innerHTML=`<h2>🤖 Solo vs TWS Bot</h2><div class="sub">${LANGS[st.lang].flag} ${LANGS[st.lang].name}</div><div class="card"><b>Difficulty</b><div class="grid3">${['easy','medium','hard'].map(x=>btn(x,'d_'+x,'choice '+(x==='medium'?'active':''))).join('')}</div></div><div class="card"><b>Timer</b><div class="grid">${[[60,'1 min'],[120,'2 min'],[180,'3 min'],[0,'∞ Geen timer']].map(([v,t])=>btn(t,'t_'+v,'choice '+(v===120?'active':''))).join('')}</div></div><div class="card"><b>Rounds</b><div class="grid3">${[5,10,15].map(v=>btn(v,'r_'+v,'choice '+(v===5?'active':''))).join('')}</div></div><div class="card"><b>+ Extra Category</b><div class="row" style="margin-top:8px"><input id="extra" class="input" placeholder="Sport, merk, film..."><button class="btn" style="width:70px" id="add">+</button></div><div id="elist"></div></div>${btn('START GAME','start','primary')}${btn('← Back','back')}`;
function exclusive(prefix,ids,val,key){ids.forEach(x=>q(prefix+x).classList.remove('active'));const chosen=q(prefix+val);chosen.classList.add('active');chosen.blur();game[key]=Number.isNaN(Number(val))?val:Number(val);buzz()}['easy','medium','hard'].forEach(v=>q('d_'+v).onclick=()=>exclusive('d_',['easy','medium','hard'],v,'difficulty'));[60,120,180,0].forEach(v=>q('t_'+v).onclick=()=>exclusive('t_',[60,120,180,0],v,'time'));[5,10,15].forEach(v=>q('r_'+v).onclick=()=>exclusive('r_',[5,10,15],v,'rounds'));q('add').onclick=()=>{let v=q('extra').value.trim();if(v&&!game.extra.includes(v))game.extra.push(v);q('elist').innerHTML=game.extra.map(x=>`<span class="pill">${x}</span>`).join('');q('extra').value=''};q('start').onclick=()=>round();q('back').onclick=home}
function pickLetter(){let chars=Array.from(LANGS[st.lang].letters),avail=chars.filter(x=>!game.used.includes(x));if(!avail.length){game.used=[];avail=chars}let l=avail[Math.floor(Math.random()*avail.length)];game.used.push(l);return l}function fmt(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}function round(){clearInterval(game.tick);game.letter=pickLetter();game.left=game.time;let cats=[...LANGS[st.lang].cats,...game.extra];app.innerHTML=`<div class="row"><div><b>Round ${game.round}/${game.rounds}</b><div class="sub">Used: ${game.used.join(' • ')}</div><div class="sub">You ${game.score} • Bot ${game.botScore}</div></div><div><div class="letter">${game.letter}</div><div id="clock" class="clock">${game.time?fmt(game.left):'∞'}</div></div></div><div class="card">${cats.map((c,i)=>`<label class="cat"><span>${c}</span><input class="input" data-a data-cat="${i}" autocomplete="off" placeholder="${game.letter}…"></label>`).join('')}</div>${btn('STOP!','stop','primary')}`;q('stop').onclick=finish;if(game.time)game.tick=setInterval(()=>{game.left--;if(q('clock'))q('clock').textContent=fmt(game.left);if(game.left<=0)finish()},1000)}
function norm(x){return (x||'').trim().toLocaleLowerCase(st.lang==='tr'?'tr-TR':st.lang==='nl'?'nl-NL':undefined)}function starts(v){return norm(v).startsWith(norm(game.letter))}function known(catIndex,val){let cat=LANGS[st.lang].cats[catIndex],arr=DB[st.lang]?.[game.letter]?.[cat]||[];return arr.some(x=>norm(x)===norm(val))}function botAnswer(catIndex){let cat=LANGS[st.lang].cats[catIndex],arr=DB[st.lang]?.[game.letter]?.[cat]||[];let chance=game.difficulty==='easy'?.45:game.difficulty==='hard'?.9:.68;if(!arr.length||Math.random()>chance)return '';return arr[Math.floor(Math.random()*arr.length)]}
function finish(){clearInterval(game.tick);beep();buzz();let rows=[...document.querySelectorAll('[data-a]')].map((el,i)=>{let u=el.value.trim(),bo=botAnswer(i),us=u?(starts(u)?(known(i,u)?'ok':'review'):'bad'):'bad',bs=bo?'ok':'bad';return{cat:[...LANGS[st.lang].cats,...game.extra][i],u,bo,us,bs}});review(rows)}
function calc(rows){let us=0,bs=0;rows.forEach(r=>{let uv=r.us==='ok',bv=r.bs==='ok',same=uv&&bv&&norm(r.u)===norm(r.bo);r.up=uv?(same?5:10):0;r.bp=bv?(same?5:10):0;us+=r.up;bs+=r.bp});return[us,bs]}
function review(rows){function render(){let [rp,bp]=calc(rows);app.innerHTML=`<h2>Answer Check — ${game.letter}</h2><div class="notice">❓ = niet zeker. Jij kunt het antwoord goed ✓ of fout ✕ keuren. Daarna worden 10 / 5 / 0 punten berekend.</div><div class="card"><div class="review"><b>Category</b><b>You</b><b>Bot 🤖</b></div>${rows.map((r,i)=>`<div class="review"><b>${r.cat}</b><div class="ans">${r.u||'—'}<div class="pts">${r.up||0} pt ${r.us==='review'?'❓':r.us==='ok'?'✓':'✕'}</div>${r.us==='review'?`<div class="reviewBtns"><button class="mini" data-ok="${i}">✓ Goed</button><button class="mini" data-bad="${i}">✕ Fout</button></div>`:''}</div><div class="ans">${r.bo||'—'}<div class="pts">${r.bp||0} pt ${r.bs==='ok'?'✓':'✕'}</div></div></div>`).join('')}</div><div class="score">+${rp} — +${bp}</div>${btn('CONFIRM SCORE','confirm','primary')}${btn('← Terug naar antwoorden','edit')}`;document.querySelectorAll('[data-ok]').forEach(x=>x.onclick=()=>{rows[+x.dataset.ok].us='ok';render()});document.querySelectorAll('[data-bad]').forEach(x=>x.onclick=()=>{rows[+x.dataset.bad].us='bad';render()});q('confirm').onclick=()=>{let[a,b]=calc(rows);game.score+=a;game.botScore+=b;scoreboard()};q('edit').onclick=()=>alert('In deze build worden antwoorden na STOP vergrendeld. Voor multiplayer stemmen spelers hier op betwiste antwoorden.')}render()}
function scoreboard(){let done=game.round>=game.rounds;app.innerHTML=`<div class="logo" style="font-size:28px">TWS</div><h2 style="text-align:center">${done?'Final Score':'Scoreboard'}</h2><div class="score">${game.score} — ${game.botScore}</div><div class="card"><b>Used letters</b><div>${game.used.map(x=>`<span class="pill">${x}</span>`).join('')}</div></div>${btn(done?'PLAY AGAIN':'NEXT ROUND','next','primary')}${btn('MAIN MENU','menu')}`;q('next').onclick=()=>{if(done)setup();else{game.round++;round()}};q('menu').onclick=home}
apply();home();
</script></body></html>
