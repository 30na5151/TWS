<script id="tws-audio-fix">
(function(){
  if(window.__twsAudioFix)return; window.__twsAudioFix=true;
  let ctx=null;
  function context(){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    if(!ctx)ctx=new AC();
    if(ctx.state==='suspended')ctx.resume().catch(()=>{});
    return ctx;
  }
  window.twsSound=function(freq,duration,volume){
    try{
      if(window.state && state.settings && state.settings.sound===false)return;
      const c=context(); if(!c)return;
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine'; o.frequency.value=freq||620;
      const now=c.currentTime;
      g.gain.setValueAtTime(Math.max(.0001,volume||.055),now);
      g.gain.exponentialRampToValueAtTime(.0001,now+(duration||.055));
      o.connect(g); g.connect(c.destination); o.start(now); o.stop(now+(duration||.055));
    }catch(e){}
  };
  function unlock(){ const c=context(); if(c){const b=c.createBuffer(1,1,22050),n=c.createBufferSource();n.buffer=b;n.connect(c.destination);n.start(0);} }
  document.addEventListener('pointerdown',unlock,{once:true,capture:true});
  document.addEventListener('touchstart',unlock,{once:true,capture:true});

  // Enter feedback only. Does not change focus/game logic.
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter' && e.target instanceof HTMLInputElement && e.target.type==='text'){
      window.twsSound(760,.045,.045);
    }
  },true);

  // Observe the visible timer text; sound exactly once for each 10..0 value.
  let last=null;
  setInterval(function(){
    const nodes=[...document.querySelectorAll('*')];
    let sec=null;
    for(const el of nodes){
      if(el.children.length)continue;
      const t=(el.textContent||'').trim();
      const m=t.match(/^(?:\d{1,2}:)?(\d{1,2})$/);
      if(!m)continue;
      const v=Number(m[1]);
      if(v>=0&&v<=10){sec=v;break;}
    }
    if(sec===null){last=null;return}
    if(sec===last)return; last=sec;
    if(sec>=6)window.twsSound(620,.05,.04);
    else if(sec>=1)window.twsSound(900,.075,.065);
    else window.twsSound(260,.22,.09);
  },120);
})();
</script>

<script id="tws-keyboard-hud-script">
(function(){

 let editing=false;
 function visibleText(el){return el && el.offsetParent!==null ? (el.textContent||'').trim() : ''}
 function getLetter(){
   if(window.g && g.letter)return String(g.letter).toUpperCase();

   for(const el of candidates){const t=visibleText(el);if(/^[A-ZÀ-ÖØ-Þ]$/i.test(t))return t.toUpperCase()}
   return '';
 }
 function getTime(){
   if(window.state && Number.isFinite(state.timeLeft)){
     const n=Math.max(0,state.timeLeft),m=Math.floor(n/60),sec=n%60;
     return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
   }
   const candidates=[...document.querySelectorAll('[class*="timer"],[id*="timer"],.time,[class*="time"]')];
   for(const el of candidates){const t=visibleText(el);if(/^\d{1,2}:\d{2}$/.test(t))return t}
   return '';
 }

   if(window.visualViewport){
     const gap=Math.max(0,window.innerHeight-window.visualViewport.height-window.visualViewport.offsetTop);
     hud.style.bottom=(gap+10)+'px';
   }else hud.style.bottom='12px';
 }

   const active=document.activeElement;
   editing=active instanceof HTMLInputElement && active.type==='text';
   const letter=getLetter(),time=getTime();
   if(editing && (letter||time)){
