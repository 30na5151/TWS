function firstMatches(v){v=v.trim();if(!v)return false;return v.toLocaleUpperCase(lang).startsWith(g.letter.toLocaleUpperCase(lang))}function norm(x){return x.trim().toLocaleLowerCase(lang)}function learnedKey(i){return lang+'|'+g.letter+'|'+i}function known(i,v){let n=norm(v),d=KNOWN[lang]?.[g.letter]?.[i]||[],learn=LEARNED[learnedKey(i)]||[];return d.some(x=>norm(x)===n)||learn.some(x=>norm(x)===n)?true:null}function learn(i,v){if(!v||i>=L[lang].cats.length)return;let k=learnedKey(i);LEARNED[k]=LEARNED[k]||[];if(!LEARNED[k].some(x=>norm(x)===norm(v)))LEARNED[k].push(v.trim());localStorage.setItem('tws-learned',JSON.stringify(LEARNED))}function botAns(i){let arr=KNOWN[lang]?.[g.letter]?.[i]||[];let chance=g.diff==='easy'?.45:g.diff==='hard'?.9:.68;if(!arr.length||Math.random()>chance)return '';return arr[Math.floor(Math.random()*arr.length)]}function finish(){clearInterval(g.tick);hideHUD();let ins=[...document.querySelectorAll('[data-answer]')],cats=[...L[lang].cats,...g.extra];g.answers=ins.map((el,i)=>{let u=el.value.trim(),bo=botAns(i),status=!u?'bad':!firstMatches(u)?'bad':known(i,u)===true?'good':'review';let bs=!bo?'bad':!firstMatches(bo)?'bad':known(i,bo)===true?'good':'review';return{cat:cats[i],u,bo,status,bs,idx:i}});review()}
function calc(){let rp=0,bp=0;g.answers.forEach(a=>{let uv=a.status==='good',bv=a.bs==='good',same=uv&&bv&&norm(a.u)===norm(a.bo);a.up=uv?(same?5:10):0;a.bp=bv?(same?5:10):0;rp+=a.up;bp+=a.bp});return[rp,bp]}
function review(){hideHUD();let [rp,bp]=calc(),pending=g.answers.some(a=>a.status==='review'||a.bs==='review');app.innerHTML=`<h2>${t('check')} · ${g.letter}</h2><div class="small">${t('unknown')} · ✓ onthoudt jouw goedgekeurde antwoorden op dit toestel.</div><div class="card">${g.answers.map((a,i)=>`<div class="answer ${a.status==='review'||a.bs==='review'?'review':(a.status==='good'||a.bs==='good'?'good':'bad')}"><b>${esc(a.cat)}</b><div class="row"><div style="flex:1"><span class="small">${t('you')}</span><br>${esc(a.u)||'—'} <span class="points">${a.status==='review'?'❓':a.up+' '+(a.status==='good'?'✓':'✕')}</span></div><div style="flex:1"><span class="small">${t('bot')} 🤖</span><br>${esc(a.bo)||'—'} <span class="points">${a.bs==='review'?'❓':a.bp+' '+(a.bs==='good'?'✓':'✕')}</span></div></div>${a.status==='review'?`<div class="reviewBtns"><button id="yes_${i}">✓ ${t('correct')}</button><button id="no_${i}">✕ ${t('wrong')}</button></div>`:''}${a.bo?`<div class="reviewBtns"><button id="byes_${i}">✓ BOT ${t('correct')}</button><button id="bno_${i}">✕ BOT ${t('wrong')}</button></div>`:''}</div>`).join('')}</div><div class="grid2"><div class="card"><div class="small">${t('you')}</div><div class="score">+${rp}</div></div><div class="card"><div class="small">${t('bot')}</div><div class="score">+${bp}</div></div></div>${pending?`<div class="notice">${t('unknown')}</div>`:b(g.round>=g.rounds?t('final'):t('next'),'next','primary')}${b(t('quit'),'quit')}`;g.answers.forEach((a,i)=>{if(a.status==='review'){q('yes_'+i).onclick=()=>{a.status='good';learn(a.idx,a.u);beep();buzz();review()};q('no_'+i).onclick=()=>{a.status='bad';review()}}if(a.bo){q('byes_'+i).onclick=()=>{a.bs='good';beep();review()};q('bno_'+i).onclick=()=>{a.bs='bad';review()}}});if(!pending)q('next').onclick=()=>{let [a,bp2]=calc();g.score+=a;g.botScore+=bp2;if(g.round>=g.rounds)final();else{g.round++;round()}};q('quit').onclick=home}
function final(){hideHUD();let msg=g.score===g.botScore?t('draw'):g.score>g.botScore?t('win'):t('botwin');app.innerHTML=`<div class="logo">TWS</div><h1 style="text-align:center">${msg}</h1><div class="score">${g.score} — ${g.botScore}</div><div class="notice">${t('used')}: ${g.used.join(' · ')}</div>${b(t('again'),'again','primary')}${b(t('menu'),'menu')}`;q('again').onclick=setup;q('menu').onclick=home}function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}languageScreen();
</script></body></html>
