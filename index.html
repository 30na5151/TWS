<script id="tws-audio-fix">
(function(){
  if(window.__twsAudioFix)return; window.__twsAudioFix=true;
  let ctx=null;
  function context(){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    if(!ctx)ctx=new AC();
    if(ctx.state==='suspended')ctx.resume().catch(()=>{});
    return ctx;
  }
  window.twsSound=function(freq,duration,volume){
    try{
      if(window.state && state.settings && state.settings.sound===false)return;
      const c=context(); if(!c)return;
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine'; o.frequency.value=freq||620;
      const now=c.currentTime;
      g.gain.setValueAtTime(Math.max(.0001,volume||.055),now);
      g.gain.exponentialRampToValueAtTime(.0001,now+(duration||.055));
      o.connect(g); g.connect(c.destination); o.start(now); o.stop(now+(duration||.055));
    }catch(e){}
  };
  function unlock(){ const c=context(); if(c){const b=c.createBuffer(1,1,22050),n=c.createBufferSource();n.buffer=b;n.connect(c.destination);n.start(0);} }
  document.addEventListener('pointerdown',unlock,{once:true,capture:true});
  document.addEventListener('touchstart',unlock,{once:true,capture:true});

  // Enter feedback only. Does not change focus/game logic.
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter' && e.target instanceof HTMLInputElement && e.target.type==='text'){

<script id="tws-keyboard-hud-script">

   const a=document.activeElement;
   return (a instanceof HTMLTextAreaElement)||(a instanceof HTMLInputElement&&a.type==='text');
 }

     active=isTyping()&&typeof g!=='undefined'&&Number.isFinite(g.left);

     hud.innerHTML='<span class="khLetter">'+letter+'</span><span>·</span><span class="khTime">⏱ '+time+'</span>'+(progress?'<span>·</span><span class="khProgress">'+progress+'</span>':'');
